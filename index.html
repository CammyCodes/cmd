<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint: apply saved colour-blind filter before first paint (no flash of wrong theme). -->
    <script>
      try {
        if (localStorage.getItem('colorblind-mode') === 'tritanopia') {
          document.documentElement.classList.add('tritanopia-mode');
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <title>cmd — Camm Design · We build worlds, not web pages</title>
    <meta
      name="description"
      content="cmd — Camm Design. A London studio that designs, builds and hosts websites for small businesses. Fast, clear, and made to bring in real customers."
    />
    <link rel="canonical" href="https://camm.design/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://camm.design/" />
    <meta property="og:title" content="cmd — Camm Design" />
    <meta
      property="og:description"
      content="Most websites are dead rocks. We build worlds. Websites for small businesses, made in London."
    />
    <meta property="og:image" content="https://camm.design/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="cmd — Camm Design" />
    <meta
      name="twitter:description"
      content="Most websites are dead rocks. We build worlds. Websites for small businesses, made in London."
    />
    <meta name="twitter:image" content="https://camm.design/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
